[project]
name = "smr-reading-service"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.119,<1",
  "uvicorn>=0.38,<1",
  "requests>=2.32,<3",
  "pymupdf==1.28.2",
  "markdown-it-py>=4,<5",
  "beautifulsoup4>=4.13,<5",
  "playwright>=1.55,<2",
  "tiktoken==0.12.0",
  "wordfreq>=3.1,<4",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.uv]
package = false
