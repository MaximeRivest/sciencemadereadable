[project]
name = "smr-pdf-prototype"
version = "0.1.0"
description = "Off-site PDF extraction, section labelling and rewrite smoke test"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "markdown-it-py>=3,<5",
    "pymupdf==1.26.7",
    "requests>=2.32,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "playwright>=1.55,<2",
]
