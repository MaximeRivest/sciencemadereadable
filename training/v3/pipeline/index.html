<script>
const svg = document.querySelector("#wrap svg"), wrap = document.getElementById("wrap");
const vb0 = svg.viewBox.baseVal; const home = {x: vb0.x, y: vb0.y, w: vb0.width, h: vb0.height};
let v = {...home};
const apply = () => svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
function toSvg(cx, cy) {
  const r = wrap.getBoundingClientRect(), s = Math.max(v.w / r.width, v.h / r.height);
  const ox = (r.width - v.w / s) / 2, oy = (r.height - v.h / s) / 2;
  return {x: v.x + (cx - r.left - ox) * s, y: v.y + (cy - r.top - oy) * s, s};
}
function zoom(f, cx, cy) {
  const r = wrap.getBoundingClientRect();
  if (cx == null) { cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
  const p = toSvg(cx, cy), nw = Math.min(Math.max(v.w / f, home.w / 40), home.w * 4);
  const k = nw / v.w; v = {x: p.x - (p.x - v.x) * k, y: p.y - (p.y - v.y) * k, w: nw, h: v.h * k}; apply();
}
wrap.addEventListener("wheel", e => { e.preventDefault(); zoom(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, {passive: false});
wrap.addEventListener("dblclick", e => zoom(1.8, e.clientX, e.clientY));

wrap.addEventListener("pointerdown", e => { wrap.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); wrap.classList.add("drag"); last = null; lastDist = null; });
wrap.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
  const list = [...pts.values()];
  if (list.length === 1) {
    if (last) { const s = toSvg(0, 0).s; v.x -= (e.clientX - last.x) * s; v.y -= (e.clientY - last.y) * s; apply(); }
    last = {x: e.clientX, y: e.clientY};
  } else if (list.length === 2) {
    const [a, b] = list, d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (lastDist) zoom(d / lastDist, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);

document.getElementById("zout").onclick = () => zoom(1 / 1.4);
document.getElementById("fit").onclick = () => { v = {...home}; apply(); };
